# --- Artemis ECS ---
artemis-odb = { module = "net.onedaybeard.artemis:artemis-odb", version.ref = "artemisOdb" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
foojay-resolver-convention = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojayResolverConventionVersion" }

