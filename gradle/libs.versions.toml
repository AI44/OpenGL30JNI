ktx-preferences = { module = "io.github.libktx:ktx-preferences", version.ref = "ktxVersion" }
ktx-reflect = { module = "io.github.libktx:ktx-reflect", version.ref = "ktxVersion" }

ktx-scene2d = { module = "io.github.libktx:ktx-scene2d", version.ref = "ktxVersion" }
