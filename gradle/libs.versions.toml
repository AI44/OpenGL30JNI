[versions]
agp = "8.13.2"
kotlin = "2.2.21"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.1"
material = "1.12.0"
constraintlayout = "2.2.0"
recyclerview = "1.3.2"
camerax = "1.4.1"
coroutines = "1.10.2"
activity = "1.9.3"
fragment = "1.8.5"
livedata = "2.8.7"
lifecycle-extensions = "2.2.0"
